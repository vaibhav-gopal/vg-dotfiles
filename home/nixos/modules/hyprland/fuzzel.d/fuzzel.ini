# ─── fuzzel : launcher + every menu (clipboard, power, keybinds) ─────────────
# Kanagawa Dragon ; colours are RRGGBBAA.

[main]
font=JetBrainsMono Nerd Font:size=13
prompt="❯  "
terminal=kitty -e
launch-prefix=uwsm app --
layer=overlay
icons-enabled=yes
icon-theme=Papirus-Dark
lines=10
width=42
horizontal-pad=20
vertical-pad=14
inner-pad=8

[colors]
background=181616e6
text=c5c9c5ff
prompt=7fb4caff
placeholder=625e5aff
input=c5c9c5ff
match=c4b28aff
selection=2d4f67ff
selection-text=c5c9c5ff
selection-match=ff9e3bff
counter=625e5aff
border=8ba4b0ff

[border]
width=2
radius=12
