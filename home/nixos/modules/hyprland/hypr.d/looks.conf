# ─── Looks : borders, blur, motion ───────────────────────────────────────────

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # the gradient slowly rotates (see `borderangle` below) : a whirlpool around the focused window
    col.active_border = $springBlue $waveAqua $dragonViolet 45deg
    col.inactive_border = $dragonBlack5

    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 10
    rounding_power = 2.5

    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(0d0c0cdd)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        vibrancy = 0.17
    }
}

# Sea-themed motion: windows surge in on the tide, the abyss rises from below.
animations {
    enabled = true

    bezier = tide, 0.05, 0.9, 0.1, 1.05
    bezier = calm, 0.25, 1, 0.5, 1
    bezier = linear, 0, 0, 1, 1

    animation = windows, 1, 6, tide, popin 80%
    animation = windowsOut, 1, 5, calm, popin 80%
    animation = border, 1, 10, calm
    # 100 = one full turn every ~10s ; set to `0` (disable) if you'd rather save battery
    animation = borderangle, 1, 100, linear, loop
    animation = fade, 1, 7, calm
    animation = layers, 1, 5, calm, fade
    animation = workspaces, 1, 6, tide, slide
    animation = specialWorkspace, 1, 6, tide, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = $dragonBlack3
    focus_on_activate = true
    vfr = true
}

xwayland {
    force_zero_scaling = true
}
