# ─── Idle ────────────────────────────────────────────────────────────────────
# 5 min dim  →  10 min lock  →  11 min screens off.
# Fullscreen windows (videos, games) pause all of this, see `idleinhibit` in rules.conf.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# suspend after 30 min ; off for a desktop, try `systemctl suspend` by hand once before enabling
# listener {
