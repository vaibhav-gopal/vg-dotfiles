# ─── vgkraken : Hyprland ─────────────────────────────────────────────────────
# This directory is symlinked from ~/vg-dotfiles (mkOutOfStoreSymlink) and Hyprland
# reloads on save, so edit away: changes land instantly, no rebuild needed.
#
# Environment variables live in ~/.config/uwsm/env-hyprland, NOT here:
# the session is launched through UWSM, which owns the environment.
#
# Forgot a shortcut? SUPER + /  (cheatsheet generated from the binds below)

# any monitor : highest refresh rate, auto position, auto scale
# (list outputs with `hyprctl monitors all`, then pin them here: monitor = DP-1, 2560x1440@165, 0x0, 1)
monitor = , highrr, auto, auto

source = ~/.config/hypr/kanagawa.conf
source = ~/.config/hypr/looks.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/autostart.conf
