# ─── Rules ───────────────────────────────────────────────────────────────────
# Hyprland 0.52 syntax (`windowrule = RULE, PROPS`) ; 0.53 rewrites rules, revisit on upgrade.

# TUIs launched from the bar (nmtui, bluetui, wiremix) float centred
windowrule = float, class:^(floating-tui)$
windowrule = size 60% 65%, class:^(floating-tui)$
windowrule = center, class:^(floating-tui)$

# dialogs and small utilities float
windowrule = float, class:^(org.pulseaudio.pavucontrol|nm-connection-editor|blueman-manager|xdg-desktop-portal-gtk)$
windowrule = float, title:^(Open File|Save File|Open Folder)(.*)$

# picture-in-picture stays on top on every workspace
windowrule = float, title:^(Picture-in-Picture)$
windowrule = pin, title:^(Picture-in-Picture)$
windowrule = keepaspectratio, title:^(Picture-in-Picture)$

# never go idle / lock while something is fullscreen (videos, games)
windowrule = idleinhibit fullscreen, class:.*

# apps can't maximise themselves ; tiling decides
windowrule = suppressevent maximize, class:.*

# fix XWayland drag-and-drop ghost windows stealing focus
windowrule = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

# the abyss gets wide margins, and spawns a terminal the first time it opens empty
workspace = special:abyss, gapsout:60, on-created-empty:uwsm app -- kitty

# frosted glass behind the bar, launcher and notifications
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, launcher
layerrule = ignorezero, launcher
layerrule = blur, notifications
layerrule = ignorezero, notifications
