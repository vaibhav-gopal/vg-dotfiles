# ─── Lock screen ─────────────────────────────────────────────────────────────
# Triggered by SUPER + Escape, the power menu, and hypridle (via `loginctl lock-session`).
# Colours are inlined (hyprlock does not read kanagawa.conf).

general {
    hide_cursor = true
    ignore_empty_input = true
}

# whatever was on screen, blurred into the deep
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    vibrancy = 0.2
}

# clock
label {
    monitor =
    text = <b>$TIME</b>
    color = rgb(c5c9c5)
    font_size = 110
    font_family = JetBrainsMono Nerd Font
    position = 0, 190
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(c4b28a)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = <i>— the kraken sleeps —</i>
    color = rgb(8ba4b0)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 45
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = 12
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgb(7fb4ca) rgb(8992a7) 45deg
    inner_color = rgba(181616cc)
    font_color = rgb(c5c9c5)
    check_color = rgb(c4b28a) rgb(ff9e3b) 45deg
    fail_color = rgb(c4746e)

    fade_on_empty = false
    placeholder_text = <i><span foreground="##625e5a">password…</span></i>
    fail_text = <i>the depths reject you ($ATTEMPTS)</i>

    position = 0, -60
    halign = center
    valign = center
}
