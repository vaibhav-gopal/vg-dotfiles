# ─── Wallpaper ───────────────────────────────────────────────────────────────
# hyprpaper 0.8 syntax: one `wallpaper { }` block per monitor (monitor empty = every monitor),
# whose path is an image or a folder it cycles through itself (timeout seconds, order).
#
# The block comes from the home-manager module (common.wallpapers): a shuffled slideshow over
# ~/vg-wallpapers/wallpapers, or The Great Wave off Kanagawa (Hokusai, public domain) when the
# slideshow is off.

splash = false
ipc = on

source = ~/.config/hyprpaper/wallpaper.conf
