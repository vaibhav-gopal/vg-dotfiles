# ─── Wallpaper ───────────────────────────────────────────────────────────────
# The Great Wave off Kanagawa, Hokusai (c. 1831, public domain) ; fetched by the
# home-manager module into ~/.local/share/wallpapers.
#
# Swap it live without editing this file:
#   hyprctl hyprpaper reload ,~/Pictures/whatever.jpg

preload = ~/.local/share/wallpapers/great-wave.jpg
wallpaper = , ~/.local/share/wallpapers/great-wave.jpg

splash = false
ipc = on
