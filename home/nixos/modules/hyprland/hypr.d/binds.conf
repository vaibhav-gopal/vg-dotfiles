# ─── Binds ───────────────────────────────────────────────────────────────────
# Everything lives on SUPER (DESIGN.md: meta+* = compositor level), so ctrl / alt / F-keys
# stay free for apps, kitty and zellij.
#
# `bindd` = bind + description ; the description is what SUPER + / shows in the cheatsheet.
# Flags stack: l = works while locked, e = repeats when held, m = mouse.

$mod = SUPER
$term = uwsm app -- kitty
$tui = uwsm app -- kitty --class floating-tui -e
$scripts = bash ~/.config/hypr/scripts

# ── apps ──
bindd = $mod, Return, Terminal, exec, $term
bindd = $mod, Space, App launcher, exec, fuzzel
bindd = $mod, E, Files (yazi), exec, $term -e yazi
bindd = $mod SHIFT, E, Files (Thunar), exec, uwsm app -- thunar
bindd = $mod, B, Browser, exec, uwsm app -- firefox
bindd = $mod, V, Clipboard history, exec, cliphist list | fuzzel --dmenu --prompt 'clip ❯ ' | cliphist decode | wl-copy
bindd = $mod SHIFT, C, Colour picker (copies hex), exec, hyprpicker --autocopy
bindd = $mod, slash, Keybind cheatsheet, exec, $scripts/cheatsheet.sh

# ── session ──
bindd = $mod, Escape, Lock screen, exec, loginctl lock-session
bindd = $mod SHIFT, Escape, Power menu, exec, $scripts/powermenu.sh
bindd = $mod, N, Toggle night light, exec, $scripts/nightlight.sh toggle
bindd = $mod SHIFT, N, Toggle do-not-disturb, exec, $scripts/dnd.sh toggle
bindd = $mod, W, Toggle bar, exec, pkill -SIGUSR1 waybar
bindd = $mod SHIFT, W, Reload bar, exec, pkill -SIGUSR2 waybar

# ── screenshots ──  (files land in ~/Pictures/Screenshots)
bindd = , Print, Screenshot area to clipboard, exec, grimblast --notify copy area
bindd = $mod SHIFT, S, Screenshot area to clipboard, exec, grimblast --notify copy area
bindd = SHIFT, Print, Screenshot screen to file, exec, grimblast --notify copysave screen
bindd = $mod, Print, Screenshot window to file, exec, grimblast --notify copysave active

# ── windows ──
bindd = $mod, Q, Close window, killactive,
bindd = $mod, F, Fullscreen, fullscreen, 0
bindd = $mod SHIFT, F, Maximise, fullscreen, 1
bindd = $mod SHIFT, Space, Toggle floating, togglefloating,
bindd = $mod, P, Pseudotile, pseudo,
bindd = $mod, S, Flip split direction, togglesplit,

bindd = $mod, H, Focus left, movefocus, l
bindd = $mod, J, Focus down, movefocus, d
bindd = $mod, K, Focus up, movefocus, u
bindd = $mod, L, Focus right, movefocus, r
bindd = $mod, left, Focus left, movefocus, l
bindd = $mod, down, Focus down, movefocus, d
bindd = $mod, up, Focus up, movefocus, u
bindd = $mod, right, Focus right, movefocus, r

bindd = $mod SHIFT, H, Move window left, movewindow, l
bindd = $mod SHIFT, J, Move window down, movewindow, d
bindd = $mod SHIFT, K, Move window up, movewindow, u
bindd = $mod SHIFT, L, Move window right, movewindow, r

binded = $mod CTRL, H, Shrink width, resizeactive, -40 0
binded = $mod CTRL, J, Grow height, resizeactive, 0 40
binded = $mod CTRL, K, Shrink height, resizeactive, 0 -40
binded = $mod CTRL, L, Grow width, resizeactive, 40 0

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── workspaces ──  (the bar labels them 一 … 十)
bindd = $mod, 1, Workspace 1, workspace, 1
bindd = $mod, 2, Workspace 2, workspace, 2
bindd = $mod, 3, Workspace 3, workspace, 3
bindd = $mod, 4, Workspace 4, workspace, 4
bindd = $mod, 5, Workspace 5, workspace, 5
bindd = $mod, 6, Workspace 6, workspace, 6
bindd = $mod, 7, Workspace 7, workspace, 7
bindd = $mod, 8, Workspace 8, workspace, 8
bindd = $mod, 9, Workspace 9, workspace, 9
bindd = $mod, 0, Workspace 10, workspace, 10

bindd = $mod SHIFT, 1, Send to workspace 1, movetoworkspace, 1
bindd = $mod SHIFT, 2, Send to workspace 2, movetoworkspace, 2
bindd = $mod SHIFT, 3, Send to workspace 3, movetoworkspace, 3
bindd = $mod SHIFT, 4, Send to workspace 4, movetoworkspace, 4
bindd = $mod SHIFT, 5, Send to workspace 5, movetoworkspace, 5
bindd = $mod SHIFT, 6, Send to workspace 6, movetoworkspace, 6
bindd = $mod SHIFT, 7, Send to workspace 7, movetoworkspace, 7
bindd = $mod SHIFT, 8, Send to workspace 8, movetoworkspace, 8
bindd = $mod SHIFT, 9, Send to workspace 9, movetoworkspace, 9
bindd = $mod SHIFT, 0, Send to workspace 10, movetoworkspace, 10

bindd = $mod, Tab, Previous workspace, workspace, previous
bindd = $mod, mouse_down, Next workspace, workspace, e+1
bindd = $mod, mouse_up, Previous workspace, workspace, e-1

# ── the abyss ──  a scratchpad that rises from below ; opens a terminal the first time
bindd = $mod, grave, Summon / dismiss the abyss, togglespecialworkspace, abyss
bindd = $mod SHIFT, grave, Sink window into the abyss, movetoworkspace, special:abyss

# ── hardware keys ──  (l = still work on the lock screen)
bindeld = , XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = , XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindld = , XF86AudioMute, Mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindld = , XF86AudioMicMute, Mute microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindeld = , XF86MonBrightnessUp, Brightness up, exec, brightnessctl -e4 -n2 set 5%+
bindeld = , XF86MonBrightnessDown, Brightness down, exec, brightnessctl -e4 -n2 set 5%-
bindld = , XF86AudioPlay, Play / pause, exec, playerctl play-pause
bindld = , XF86AudioPause, Play / pause, exec, playerctl play-pause
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous
