# ─── Input ───────────────────────────────────────────────────────────────────

input {
    kb_layout = us

    # same feel as vgmacbook (InitialKeyRepeat = 15 -> 225ms, KeyRepeat = 3 -> ~22/s)
    repeat_delay = 225
    repeat_rate = 22

    follow_mouse = 1
    sensitivity = 0

    # also mirrors the mac: natural scrolling, tap to click
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
    }
}

# touchpad: 3 fingers sideways flips workspaces, 3 fingers up summons the abyss (scratchpad)
gesture = 3, horizontal, workspace
gesture = 3, up, special, abyss
