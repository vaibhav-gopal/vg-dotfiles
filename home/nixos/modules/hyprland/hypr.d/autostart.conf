# ─── Autostart ───────────────────────────────────────────────────────────────
# Everything starts here (not as systemd services) so none of it leaks into the
# Plasma fallback session. `uwsm app --` runs each one in its own systemd scope.

exec-once = uwsm app -- waybar
exec-once = uwsm app -- mako
exec-once = uwsm app -- hyprpaper
exec-once = uwsm app -- hypridle
exec-once = uwsm app -- hyprpolkitagent

# clipboard history (SUPER + V)
exec-once = uwsm app -- wl-paste --type text --watch cliphist store
exec-once = uwsm app -- wl-paste --type image --watch cliphist store

# USB drives: automount, notify through mako, tray icon only while something is plugged in
exec-once = uwsm app -- udiskie --automount --notify --smart-tray --appindicator

# cursor, icons and dark mode for GTK apps
# (color-scheme covers GTK4 / libadwaita + Electron, gtk-theme covers older GTK3 apps like Thunar)
# Plasma rewrites these when it starts, and they are re-applied on the next Hyprland login
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
exec-once = dconf write /org/gnome/desktop/interface/cursor-theme "'Bibata-Modern-Classic'"
exec-once = dconf write /org/gnome/desktop/interface/color-scheme "'prefer-dark'"
exec-once = dconf write /org/gnome/desktop/interface/gtk-theme "'Adwaita-dark'"
exec-once = dconf write /org/gnome/desktop/interface/icon-theme "'Papirus-Dark'"

exec-once = mkdir -p ~/Pictures/Screenshots
