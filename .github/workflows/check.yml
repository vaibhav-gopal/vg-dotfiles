# What a change must pass before it reaches a machine: every host evaluates, the shared home layer
# builds (vgwsl2's home-files, ~1.1 GiB: a build failure that evaluation missed shipped once), the
# guests stay isolated on a shared host (a VM test), and the scripts pass shellcheck and their tests
# (bootstrap, wallpaper, dot).
# tend: vg-dotfiles/Composition
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hosts:
    name: evaluate every host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: bash nix/scripts/check-hosts.sh
      - run: bash nix/scripts/tests/exports.test.sh
      - run: bash nix/scripts/tests/profiles.test.sh

  home:
    name: build the home layer (vgwsl2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix build -L --no-link ./nix#homeConfigurations.vgwsl2.config.home-files

  isolation:
    name: guest isolation (NixOS VM test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23 # turns on KVM for the VMs
      - run: nix build -L --no-link ./nix#checks.x86_64-linux.isolation

  scripts:
    name: shellcheck and bootstrap tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      # nix/dot/*.sh are shellchecked as one script when dot builds (writeShellApplication)
      - run: nix develop --command shellcheck -x nix/scripts/*.sh nix/scripts/bootstrap/*.sh nix/scripts/tests/*.sh
      - run: bash nix/scripts/tests/bootstrap.test.sh
      - run: bash nix/scripts/tests/wallpaper.test.sh
      - run: bash nix/scripts/tests/dot.test.sh
